name: 📱 Construire l'APK COPAF Terrain

on:
  workflow_dispatch:   # lancement manuel depuis l'onglet Actions

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terrain-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer Capacitor
        run: npm install --no-audit --no-fund

      - name: Créer le projet Android
        run: npx cap add android

      - name: Icônes de l'application
        run: npx capacitor-assets generate --android --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#00367F'

      - name: Autoriser la caméra (scan des badges)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$MANIFEST"
          grep -n "CAMERA\|INTERNET" "$MANIFEST"

      - name: Synchroniser
        run: npx cap sync android

      - name: Construire l'APK
        working-directory: terrain-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Nommer le fichier
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk COPAF-Terrain.apk
          ls -la COPAF-Terrain.apk

      - uses: actions/upload-artifact@v4
        with:
          name: COPAF-Terrain-apk
          path: terrain-app/COPAF-Terrain.apk
          retention-days: 30
