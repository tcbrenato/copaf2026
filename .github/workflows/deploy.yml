name: 🚀 Build et déploiement vers Hostinger

on:
  push:
    branches:
      - main   # adapte si ta branche principale s'appelle autrement (ex: master)
  workflow_dispatch:   # permet aussi de le lancer manuellement depuis l'onglet Actions

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Récupérer le code
        uses: actions/checkout@v4

      - name: 🔧 Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Installer les dépendances
        run: npm install

      - name: 🛠️ Build du projet
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SHEET_URL_INSCRIPTIONS: ${{ secrets.VITE_SHEET_URL_INSCRIPTIONS }}
          VITE_SHEET_URL_ADMIN: ${{ secrets.VITE_SHEET_URL_ADMIN }}

      - name: 📂 Envoyer sur Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./
          timeout: 60000
          log-level: verbose
          # IMPORTANT : on ne met PAS dangerous-clean-slate ici,
          # pour ne jamais supprimer les images (hero*.png, intervenant*.png, copaf.png, etc.)
          # que tu uploades manuellement et qui ne sont pas versionnées dans Git.
          # documents/** exclu : ce dossier n'existe plus cote local (fichier PDF
          # retire de public/documents/), mais le serveur le trackait encore depuis
          # un ancien déploiement -> tentative de suppression distante en echec
          # ("550 /documents: No such file or directory"), qui faisait echouer tout
          # le job. On laisse ce chemin tranquille plutot que de dependre de l'etat
          # exact du serveur.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            documents/**
            documents
          # state-name renomme : le fichier d'etat suivi par l'action avait derive
          # de la realite du serveur (il croyait que d'anciens fichiers generes
          # avec un hash different, ex. assets/index-CJNWMunQ.js, existaient encore
          # -> tentative de suppression distante en echec, "550 ... No such file or
          # directory", meme symptome que documents/ mais sur un fichier different
          # a chaque build). Un nouveau nom de fichier d'etat repart de zero : ce
          # run traite tout comme neuf (aucune suppression tentee), et ecrit un
          # etat propre pour les prochains déploiements.
          state-name: .ftp-deploy-sync-state-v2.json
        continue-on-error: true
        id: ftp-attempt-1

      - name: 🔁 Nouvelle tentative si echec reseau (FTP simple, sans TLS)
        if: steps.ftp-attempt-1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: ./
          timeout: 90000
          log-level: verbose
          # IMPORTANT : on ne met PAS dangerous-clean-slate ici,
          # pour ne jamais supprimer les images (hero*.png, intervenant*.png, copaf.png, etc.)
          # que tu uploades manuellement et qui ne sont pas versionnées dans Git.
          # documents/** exclu + state-name renomme : voir commentaires equivalents
          # sur la tentative FTPS ci-dessus.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            documents/**
            documents
          state-name: .ftp-deploy-sync-state-v2.json
        id: ftp-attempt-2

      - name: ❌ Échec final si les deux tentatives ont échoué
        if: steps.ftp-attempt-1.outcome == 'failure' && steps.ftp-attempt-2.outcome == 'failure'
        run: |
          echo "Les deux tentatives de déploiement FTP/FTPS ont échoué."
          echo "Vérifie : FTP_HOST (sans ftp://), FTP_USERNAME, FTP_PASSWORD dans les secrets GitHub,"
          echo "et la config Sécurité/liste blanche IP dans hPanel Hostinger."
          exit 1