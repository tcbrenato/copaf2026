    <!-- Navigateurs anciens (Chrome < 71) : globalThis n'existe pas et les bibliothèques le lisent dès leur chargement -->
    <script>if (typeof globalThis === 'undefined') { window.globalThis = window }</script>
    <!-- Lien personnel des tablettes (/t/CODE, ou ancien format /tablette?t=JETON) : le code est rangé dans sessionStorage et
         retiré de la barre d'adresse (on redirige vers /tablette) AVANT le chargement de tout outil de mesure d'audience
         (Google, Facebook, LinkedIn), qui sinon le recevraient dans l'URL. -->
    <script>
      (function () {
        try {
          var cible = '/diagnostic'; // lien court /t/CODE : on arrive directement sur l'outil Diagnostic
          var m = location.pathname.match(/^\/t\/([A-Za-z0-9_-]+)\/?$/);
          if (!m && location.pathname.replace(/\/+$/, '') === '/tablette') { m = location.search.match(/[?&]t=([A-Za-z0-9_-]+)/); cible = '/tablette'; }
          if (!m) return;
          sessionStorage.setItem('copaf_tablette_t', m[1]);
          history.replaceState(null, '', cible);
        } catch (e) {}
      })();
    </script>
    <!-- Écran de secours : si l'application ne démarre pas (JavaScript non compatible, réseau coupé), proposer de recharger -->

        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#0000A6;color:#fff;padding:18px 16px;text-align:center;font:600 16px sans-serif';
        d.innerHTML = 'La page n’a pas pu se charger. <button onclick="location.reload()" style="margin-left:12px;padding:12px 24px;border:0;border-radius:10px;background:#fff;color:#0000A6;font:800 16px sans-serif">Recharger</button>';
        document.body.appendChild(d);
      }, 15000);
    </script>
